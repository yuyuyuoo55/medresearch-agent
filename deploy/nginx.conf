# deploy/nginx.conf
# 作用：① 托管前端静态文件（frontend/dist） ② 把 /api 和 /ws 反向代理到 api 容器
# 使用前确认 compose 里 web 服务把本文件挂到 /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传附件可能较大，默认 1m 会直接 413
    client_max_body_size 50m;

    # SPA 路由回退：刷新 / 直接访问子路径时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTTP 接口：任务提交、文件列表、下载、上传
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长任务（综合报告可能几分钟）需要放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 如果后续接 SSE 流式输出，必须关掉缓冲，否则前端会「憋着不吐字」
        # proxy_buffering off;
    }

    # WebSocket：/ws/{thread_id}，推送执行事件
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # 这两行是 WebSocket 的关键：升级协议
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 长连接不要被 60s 默认超时掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
